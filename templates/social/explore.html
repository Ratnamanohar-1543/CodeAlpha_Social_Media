{% extends "base.html" %}{% block content %}<form><input name="q" value="{{ q }}" placeholder="🔍 Search users" style="width:100%;padding:11px;border-radius:8px;border:1px solid #dbdbdb;margin-bottom:16px"></form>
{% for u in users %}<div class="side row"><img class="av" src="{{ u.profile.pic }}" alt=""><span><a href="{% url 'profile' u.username %}"><b>{{ u.username }}</b></a></span></div>{% endfor %}
<div class="grid3">{% for p in posts %}<a href="{% url 'post' p.pk %}"><img src="{{ p.src }}" alt="" loading="lazy"></a>{% endfor %}</div>{% endblock %}
